name: Case 01 static game integrity
on:
  push:
    branches: [main, refactor-asset-pipeline-game-structure-2026, feat-actual-desk-ibm-photos-20261031, fix-fullscreen-photo-scenes-20261031, fix-minimal-ui-real-props-20261031, fix-trash-paper-drop-hitbox-20261031, remove-desk-tutorial-copy-20261031, fix-dossier-unclip-folder-trash-recovery, fix-fullscreen-paper-windows-cold-ui-20261031, fix-room-back-icon-only-cache-20261031, fix-admission-room-id-minimal-ui-no-hotspot-labels, fix-clip-size-disposal-and-back-20261031, fix-ibm-viewport-scroll-overflow-20261031, fix-real-ibm-page-scroll-and-back-button-20261101, fix-tiny-clip-cold-rings-auto-intake-20261101]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify evidence, desk, room, audio and assets
        run: npm test
